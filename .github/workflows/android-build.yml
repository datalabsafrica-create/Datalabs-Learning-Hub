name: Build Datalabs Learning Hub

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure Firebase google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork || false }}
        run: |
          set -euo pipefail

          validate_google_services() {
            local target_file="$1"
            python3 - "$target_file" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except json.JSONDecodeError as e:
              print(f"::error::{path} is not valid JSON (line {e.lineno}, column {e.colno}).")
              sys.exit(1)
          except Exception:
              print(f"::error::Failed to read {path}.")
              sys.exit(1)

          if not isinstance(data, dict):
              print(f"::error::{path} must contain a JSON object.")
              sys.exit(1)

          clients = data.get("client", [])
          if not isinstance(clients, list):
              print(f"::error::{path} has an invalid 'client' field.")
              sys.exit(1)

          packages = [
              c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for c in clients
              if isinstance(c, dict)
          ]
          if "com.aistudio.datalabshub.k7m9xp" not in packages:
              print(f"::error::{path} does not contain package com.aistudio.datalabshub.k7m9xp.")
              sys.exit(1)
          PY
          }

          mkdir -p app
          TMP_GOOGLE_SERVICES="$(mktemp)"
          trap 'rm -f "$TMP_GOOGLE_SERVICES"' EXIT

          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 is available. Decoding into app/google-services.json..."
            if ! printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 --decode > "$TMP_GOOGLE_SERVICES" 2>/dev/null; then
              echo "::error::Failed to decode GOOGLE_SERVICES_JSON_BASE64. Ensure the secret contains valid Base64."
              exit 1
            fi
          elif [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 is unset; falling back to GOOGLE_SERVICES_JSON."
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$TMP_GOOGLE_SERVICES"
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is empty or unavailable in this step (event='${WORKFLOW_EVENT_NAME:-unknown}', fork_pr='${IS_FORK_PR:-false}')."
            echo "Troubleshooting: Ensure GOOGLE_SERVICES_JSON_BASE64 is saved under GitHub Repository Secrets (Settings -> Secrets and variables -> Actions -> Repository secrets), not only an Environment secret, and note that GitHub withholds secrets on forked pull requests."
            if [ -s "app/google-services.json" ]; then
              validate_google_services "app/google-services.json"
              echo "Using existing valid app/google-services.json from repository."
              exit 0
            fi
            echo "::error::app/google-services.json could not be generated because GOOGLE_SERVICES_JSON_BASE64 is unavailable in GitHub repository secrets and no committed app/google-services.json exists."
            exit 1
          fi

          if [ ! -s "$TMP_GOOGLE_SERVICES" ]; then
            echo "::error::Decoded Firebase configuration is empty."
            exit 1
          fi

          validate_google_services "$TMP_GOOGLE_SERVICES"

          if [ -s "app/google-services.json" ] && cmp -s "$TMP_GOOGLE_SERVICES" "app/google-services.json"; then
            echo "app/google-services.json is already up to date and valid."
            exit 0
          fi

          mv "$TMP_GOOGLE_SERVICES" app/google-services.json
          chmod 600 app/google-services.json
          if [ -n "${GITHUB_ENV:-}" ]; then
            echo "GOOGLE_SERVICES_FROM_SECRET=true" >> "$GITHUB_ENV"
          fi
          test -s app/google-services.json
          echo "Successfully generated and validated app/google-services.json."

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Configure SDK Paths, Accept Licenses, and Install Required Packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory not found at '$SDK_ROOT'."
            exit 1
          fi

          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          if [ -n "${GITHUB_ENV:-}" ]; then
            echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
            echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          fi

          if [ -d "$SDK_ROOT/cmdline-tools/latest/bin" ]; then
            CMDLINE_BIN="$SDK_ROOT/cmdline-tools/latest/bin"
          else
            CMDLINE_BIN="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -type d -name bin 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [ -z "$CMDLINE_BIN" ] || [ ! -x "$CMDLINE_BIN/sdkmanager" ]; then
            echo "::error::sdkmanager executable not found under '$SDK_ROOT/cmdline-tools'."
            exit 1
          fi

          export PATH="$CMDLINE_BIN:$SDK_ROOT/platform-tools:$PATH"
          if [ -n "${GITHUB_PATH:-}" ]; then
            echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
            echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          fi

          echo "Using sdkmanager at: $(command -v sdkmanager)"

          LICENSE_LOG="$(mktemp)"
          if ! yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >"$LICENSE_LOG" 2>&1; then
            SDKMANAGER_STATUS="${PIPESTATUS[1]:-1}"
            cat "$LICENSE_LOG"
            if [ "$SDKMANAGER_STATUS" -ne 0 ]; then
              echo "::error::sdkmanager --licenses failed with exit code $SDKMANAGER_STATUS."
              rm -f "$LICENSE_LOG"
              exit "$SDKMANAGER_STATUS"
            fi
          else
            cat "$LICENSE_LOG"
          fi
          rm -f "$LICENSE_LOG"

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36.1" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper Is Executable
        shell: bash
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "::error::Missing ./gradlew at repository root."
            exit 1
          fi
          chmod +x ./gradlew

      - name: Decode Release Upload Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork || false }}
        run: |
          set -euo pipefail

          missing_secrets=()
          [ -z "${KEYSTORE_BASE64:-}" ] && missing_secrets+=("KEYSTORE_BASE64")
          [ -z "${STORE_PASSWORD:-}" ] && missing_secrets+=("STORE_PASSWORD")
          [ -z "${KEY_PASSWORD:-}" ] && missing_secrets+=("KEY_PASSWORD")

          if [ "${#missing_secrets[@]}" -gt 0 ]; then
            echo "::error::Missing release signing secrets in GitHub Repository Secrets: ${missing_secrets[*]} (event='${WORKFLOW_EVENT_NAME:-unknown}', fork_pr='${IS_FORK_PR:-false}'). Add KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD under Settings -> Secrets and variables -> Actions -> Repository secrets (keyAlias must be 'upload')."
            exit 1
          fi

          KEYSTORE_TARGET="${RUNNER_TEMP}/upload-keystore.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_TARGET" 2>/dev/null; then
            rm -f "$KEYSTORE_TARGET"
            echo "::error::Failed to decode KEYSTORE_BASE64. Ensure KEYSTORE_BASE64 contains valid Base64-encoded keystore bytes."
            exit 1
          fi

          if [ ! -s "$KEYSTORE_TARGET" ]; then
            rm -f "$KEYSTORE_TARGET"
            echo "::error::Decoded release keystore file is empty."
            exit 1
          fi

          chmod 600 "$KEYSTORE_TARGET"
          if ! keytool -list -keystore "$KEYSTORE_TARGET" -alias upload -storepass:env STORE_PASSWORD >/dev/null 2>&1; then
            rm -f "$KEYSTORE_TARGET"
            echo "::error::Decoded keystore verification failed. Check KEYSTORE_BASE64, STORE_PASSWORD, and verify that the keystore contains key alias 'upload'."
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_TARGET" >> "$GITHUB_ENV"
          echo "Successfully decoded and verified upload keystore (alias 'upload')."

      - name: Build Android App Bundle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Clean Up Temporary Secret Files
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/upload-keystore.jks"
          if [ "${GOOGLE_SERVICES_FROM_SECRET:-false}" = "true" ]; then
            rm -f app/google-services.json
          fi

      - name: Save AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: datalabs-learning-hub
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
