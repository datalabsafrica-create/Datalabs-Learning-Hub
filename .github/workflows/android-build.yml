name: Build Datalabs Learning Hub

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-36.1
            platforms;android-36
            build-tools;36.0.0

      - name: Ensure Android Command-Line Tools in PATH and Accept SDK Licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          if [ -n "$SDK_ROOT" ]; then
            export ANDROID_SDK_ROOT="$SDK_ROOT"
            export ANDROID_HOME="$SDK_ROOT"
            if [ -d "$SDK_ROOT/cmdline-tools/latest/bin" ]; then
              CMDLINE_BIN="$SDK_ROOT/cmdline-tools/latest/bin"
            else
              CMDLINE_BIN="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -type d -name bin 2>/dev/null | sort | head -n 1)"
            fi
            if [ -n "$CMDLINE_BIN" ]; then
              export PATH="$CMDLINE_BIN:$SDK_ROOT/platform-tools:$PATH"
              [ -n "${GITHUB_PATH:-}" ] && echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
              [ -n "${GITHUB_PATH:-}" ] && echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
            fi
          fi
          command -v sdkmanager
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper Is Executable
        shell: bash
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "::error::Missing ./gradlew at repository root."
            exit 1
          fi
          chmod +x ./gradlew

      - name: Configure Firebase google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 --decode > app/google-services.json
            echo "GOOGLE_SERVICES_FROM_SECRET=true" >> "$GITHUB_ENV"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "GOOGLE_SERVICES_FROM_SECRET=true" >> "$GITHUB_ENV"
          fi

          if [ ! -s "app/google-services.json" ]; then
            echo "::error::app/google-services.json is missing. Add GOOGLE_SERVICES_JSON_BASE64 (or GOOGLE_SERVICES_JSON) to GitHub repository secrets."
            exit 1
          fi

          python3 - <<'PY'
          import json, sys
          try:
              with open("app/google-services.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"::error::app/google-services.json is not valid JSON: {e}")
              sys.exit(1)
          clients = data.get("client", [])
          packages = [
              c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for c in clients
          ]
          if "com.aistudio.datalabshub.k7m9xp" not in packages:
              print("::error::app/google-services.json does not contain package com.aistudio.datalabshub.k7m9xp.")
              sys.exit(1)
          PY

      - name: Decode Release Upload Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing release signing secrets. Add KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD in GitHub repository secrets (key alias must be 'upload')."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "${RUNNER_TEMP}/upload-keystore.jks"
          echo "KEYSTORE_PATH=${RUNNER_TEMP}/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build Android App Bundle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Clean Up Temporary Secret Files
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/upload-keystore.jks"
          if [ "${GOOGLE_SERVICES_FROM_SECRET:-false}" = "true" ]; then
            rm -f app/google-services.json
          fi

      - name: Save AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: datalabs-learning-hub
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
